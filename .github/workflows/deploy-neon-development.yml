name: Deploy Neon API (development only)
on:
  push:
    branches: [development]
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'database/migrations/**'
      - '.github/workflows/deploy-neon-development.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-DEVELOPMENT to deploy only to the Neon development branch
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: neon-api-development
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/development' && (github.event_name == 'push' || inputs.confirm == 'DEPLOY-DEVELOPMENT')
    runs-on: ubuntu-latest
    environment: neon-development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @studio/contracts build
      - run: pnpm --filter @studio/api build
      - run: pnpm --filter @studio/api bundle
      - name: Install Neon CLI
        run: npm install --global neon@latest
      - name: Link project and pin development branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          test -n "$NEON_API_KEY" || { echo "NEON_API_KEY repository secret is required"; exit 1; }
          neon link --project-id shy-silence-28583411 --no-env-pull -y
          neon checkout development --no-env-pull
      - name: Pull development database environment
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: neon env pull --file .env.development --service postgres
      - name: Apply pending development migrations
        run: pnpm --filter @studio/api exec node scripts/migrate.mjs
      - name: Remove development database environment file
        if: always()
        run: rm -f .env.development
      - name: Deploy API to Neon development branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: neon functions deploy studioapi --src apps/api/dist/function/index.mjs
      - name: Smoke test deployed development API
        env:
          API_BASE_URL: https://br-rough-block-azkcw5t3-studioapi.compute.c-3.ap-southeast-1.aws.neon.tech
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 "$API_BASE_URL/health")"
          node -e 'const body = JSON.parse(process.argv[1]); if (body.ok !== true || body.database !== "reachable" || body.security !== "ready") { console.error(body); process.exit(1); }' "$health"
          echo "Health check passed: API and database are reachable."

          for path in /api/v1/me /api/v1/workspaces; do
            status="$(curl --silent --show-error --output /tmp/studio-api-response.json --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$API_BASE_URL$path")"
            if [ "$status" != "401" ]; then
              echo "Expected HTTP 401 from $path without credentials, received $status"
              cat /tmp/studio-api-response.json
              exit 1
            fi
            echo "Auth guard passed: $path rejects unauthenticated requests."
          done

          invalid_status="$(curl --silent --show-error --output /tmp/studio-api-invalid-token.json --write-out '%{http_code}' --connect-timeout 10 --max-time 30 --header 'Authorization: Bearer invalid-test-token' "$API_BASE_URL/api/v1/me")"
          if [ "$invalid_status" != "401" ]; then
            echo "Expected HTTP 401 for an invalid bearer token, received $invalid_status"
            cat /tmp/studio-api-invalid-token.json
            exit 1
          fi
          echo "JWT guard passed: invalid bearer token is rejected."

          allowed_origin="$(curl --silent --show-error --output /dev/null --dump-header - --request OPTIONS "$API_BASE_URL/api/v1/me" --header 'Origin: https://akvisomr-eng.github.io' --header 'Access-Control-Request-Method: GET' --header 'Access-Control-Request-Headers: authorization' | tr -d '\r' | grep -i '^access-control-allow-origin:' | tail -1 | cut -d' ' -f2-)"
          if [ "$allowed_origin" != "https://akvisomr-eng.github.io" ]; then
            echo "Expected configured GitHub Pages origin to be allowed; received: $allowed_origin"
            exit 1
          fi
          echo "CORS passed: configured GitHub Pages origin is allowed."

          untrusted_origin="$(curl --silent --show-error --output /dev/null --dump-header - --request OPTIONS "$API_BASE_URL/api/v1/me" --header 'Origin: https://untrusted.example' --header 'Access-Control-Request-Method: GET' --header 'Access-Control-Request-Headers: authorization' | tr -d '\r' | grep -i '^access-control-allow-origin:' | tail -1 | cut -d' ' -f2- || true)"
          if [ -n "$untrusted_origin" ]; then
            echo "Untrusted origin unexpectedly received CORS permission: $untrusted_origin"
            exit 1
          fi
          echo "CORS passed: untrusted origin is not allowed."
